<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>a little letter for you ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grain"></div>
<div id="app">

<div class="page">
  <svg class="deco floaty" style="--r:6deg; bottom:8%; left:8%; width:34px;" viewBox="0 0 40 40"><path d="M20 2c10 6 10 30 0 36-10-6-10-30 0-36Z" fill="#EDDEBA"/></svg>
  <svg class="deco" style="top:10%; right:12%; width:11px; animation:twinkle 2s .3s ease-in-out infinite;" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#C9A05A"/></svg>

  <div class="section" style="text-align:center; margin-top:20px;">
    <span class="eyebrow-tag reveal"><span class="dot"></span>dari abang, buat adekk kesayangan abangg</span>

    <div class="letter-card reveal" style="margin-top:20px; text-align:left;">
      <!-- GANTI FOTO: lihat cara pasang di komentar dekat .mini-photo di css/style.css -->
      <div class="letter-pin"><div class="mini-photo c5" style="background-image:url('assets/kartu.jpeg'); background-size:cover; background-position:center;"></div></div>
      <svg class="smiley-sticker" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#F4D58D"/><circle cx="14" cy="17" r="2.4" fill="#3F2226"/><circle cx="26" cy="17" r="2.4" fill="#3F2226"/><path d="M12 24 Q20 31 28 24" stroke="#3F2226" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      <h3 id="letterTo">My Dearest</h3>
      <p id="letterP1"></p>
      <p id="letterP2"></p>
      <p class="letter-sign">- ur cool boyfiee</p>
    </div>

    <a href="hub.html" class="btn reveal" style="margin-top:34px;">Continue →</a>
  </div>
</div>

</div><!-- /app -->

<script src="js/script.js"></script>
<script>
  document.getElementById('letterTo').textContent = birthdayGirl.letterTo;
  document.getElementById('letterP1').textContent = birthdayGirl.letter[0] || '';
  document.getElementById('letterP2').textContent = birthdayGirl.letter[1] || '';
</script>
</body>
</html>
