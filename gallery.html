<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>little moments ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .grid-gallery{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; width:100%; max-width:340px; margin:0 auto;}
  .grid-gallery .mini-polaroid:nth-child(odd){transform:rotate(-3deg);}
  .grid-gallery .mini-polaroid:nth-child(even){transform:rotate(2.5deg);}
</style>
</head>
<body>
<div class="grain"></div>
<div id="app">

<div class="page">
  <svg class="deco floaty" style="--r:6deg; top:8%; left:8%; width:28px;" viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.8 2.5 5 6.2 5c2 0 3.4 1.1 4.1 2.4C11 6.1 12.4 5 14.4 5 18.1 5 19.9 8.8 18 12.5 16 16.65 12 21 12 21Z" fill="#712D38"/></svg>
  <svg class="deco" style="top:12%; right:10%; width:12px; animation:twinkle 2.4s ease-in-out infinite;" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#C9A05A"/></svg>

  <div class="section" style="text-align:center; margin-top:20px;">
    <!-- GANTI KATA-KATA (label kecil & judul halaman ini ditulis langsung di HTML) -->
    <span class="eyebrow-tag reveal"><span class="dot"></span>my favorite memories</span>
    <h1 class="title-serif reveal" style="font-size:clamp(1.6rem,5vw,2rem); margin-bottom:30px;">little moments <span class="title-hand" style="font-style:normal;">♡</span></h1>

    <!-- GANTI FOTO (6 foto di sini) + KATA-KATA: cara pasang foto ada di komentar dekat
         .mini-photo di css/style.css. Teks di data-cap="..." adalah caption yang muncul
         waktu foto diklik/dibesarkan (lightbox) — ganti sesuai momennya masing-masing. -->
    <div class="grid-gallery">
      <button class="mini-polaroid reveal" data-cap="our first chat after kode kodean di ig"><div class="mini-photo c1" style="background-image:url('assets/firstchat.jpeg'); background-size:cover; background-position:center;"></div><p class="mini-cap">first chat</p></button>
      <button class="mini-polaroid reveal" data-cap="our first fotbar dengan Pramuka Paskib nya"><div class="mini-photo c2" style="background-image:url('assets/firstfotbar.jpeg'); background-size:cover; background-position:center;"></div><p class="mini-cap">first fotbar</p></button>
      <button class="mini-polaroid reveal" data-cap="our first date"><div class="mini-photo c3" style="background-image:url('assets/firstdate.jpeg'); background-size:cover; background-position:center;"></div><p class="mini-cap">first date</p></button>
      <button class="mini-polaroid reveal" data-cap="My favorite photo of us"><div class="mini-photo c4" style="background-image:url('assets/favorite.jpeg'); background-size:cover; background-position:center;"></div><p class="mini-cap">my favorite</p></button>
      <button class="mini-polaroid reveal" data-cap="akuu nemenin adekk lombaa"><div class="mini-photo c5" style="background-image:url('assets/lombaadek.jpeg'); background-size:cover; background-position:center;"></div><p class="mini-cap">Lomba adekk</p></button>
      <button class="mini-polaroid reveal" data-cap="adekk nemenin abangg lombaa"><div class="mini-photo c1" style="background-image:url('assets/lombaabang.jpeg'); background-size:cover; background-position:center;"></div><p class="mini-cap">Lomba abangg</p></button>
    </div>
  </div>
</div>

<div class="mini-nav">
  <a href="hub.html" title="Menu"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7" stroke="#4A1D24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="#4A1D24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <a href="music.html" title="Music"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l11-2v13" stroke="#4A1D24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="#4A1D24" stroke-width="1.8"/><circle cx="17" cy="16" r="3" stroke="#4A1D24" stroke-width="1.8"/></svg></a>
  <a href="gallery.html" class="active" title="Gallery"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="14" rx="2" stroke="#4A1D24" stroke-width="1.8"/><circle cx="12" cy="13" r="3.5" stroke="#4A1D24" stroke-width="1.8"/></svg></a>
  <a href="notes.html" title="Notes"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16v13a1 1 0 01-1 1H5a1 1 0 01-1-1V6Z" stroke="#4A1D24" stroke-width="1.8"/><path d="M4 6l8 6 8-6" stroke="#4A1D24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</div>

<div id="lightbox">
  <span class="lb-close" id="lbClose">✕</span>
  <div class="lb-card">
    <div class="lb-photo mini-photo c1" id="lbPhoto"></div>
    <p class="lb-cap" id="lbCap">that one afternoon</p>
  </div>
</div>

</div><!-- /app -->

<script src="js/script.js"></script>
</body>
</html>
