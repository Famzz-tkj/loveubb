<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>our song ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grain"></div>
<div id="app">

<div class="page">
  <svg class="deco floaty" style="--r:-6deg; top:8%; right:8%; width:30px;" viewBox="0 0 40 40"><path d="M20 2c10 6 10 30 0 36-10-6-10-30 0-36Z" fill="#EDDEBA"/></svg>
  <svg class="deco" style="top:14%; left:10%; width:10px; animation:twinkle 2.3s .4s ease-in-out infinite;" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#712D38"/></svg>

  <div class="section" style="text-align:center; margin-top:20px;">
    <!-- GANTI KATA-KATA (label kecil & judul halaman ini ditulis langsung di HTML) -->
    <span class="eyebrow-tag reveal"><span class="dot"></span>a song will remind you of us</span>
    <h1 class="title-serif reveal" style="font-size:clamp(1.5rem,5vw,1.9rem); margin-bottom:30px;">Press play, <span class="title-hand" style="font-style:normal;">stay a while</span></h1>

    <div class="player-card reveal" id="playerCard">
      <!-- notes kecil yang melayang waktu lagu diputar -->
      <div class="note-float n1">♪</div>
      <div class="note-float n2">♫</div>
      <div class="note-float n3">♪</div>

      <div class="vinyl-wrap">
        <div class="vinyl-glow"></div>
        <div class="vinyl">
          <div class="vinyl-label" style="background-image:url('assets/musik.jpeg'); background-size:cover; background-position:center;"></div>
        </div>
        <div class="tonearm"></div>
      </div>

      <p class="p-title" id="pTitle">our song</p>
      <p class="p-artist" id="pArtist">artist name</p>

      <div class="eq-bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="p-progress" id="pProgress"><div class="p-progress-fill" id="pFill"></div></div>
      <div class="p-time"><span id="pCur">0:00</span><span id="pDur">0:00</span></div>
      <div class="p-controls">
        <input type="range" class="p-vol" id="pVol" min="0" max="1" step="0.01" value="0.7">
        <button class="p-play" id="pPlay">▶</button>
      </div>
      <p class="p-hint">lagu nya indah, kaya yang lagi ulang tahun sekarang ✨</p>
    </div>
  </div>
</div>

<div class="mini-nav">
  <a href="hub.html" title="Menu"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7" stroke="#4A1D24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="#4A1D24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <a href="music.html" class="active" title="Music"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l11-2v13" stroke="#4A1D24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="#4A1D24" stroke-width="1.8"/><circle cx="17" cy="16" r="3" stroke="#4A1D24" stroke-width="1.8"/></svg></a>
  <a href="gallery.html" title="Gallery"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="14" rx="2" stroke="#4A1D24" stroke-width="1.8"/><circle cx="12" cy="13" r="3.5" stroke="#4A1D24" stroke-width="1.8"/></svg></a>
  <a href="notes.html" title="Notes"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16v13a1 1 0 01-1 1H5a1 1 0 01-1-1V6Z" stroke="#4A1D24" stroke-width="1.8"/><path d="M4 6l8 6 8-6" stroke="#4A1D24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</div>

</div><!-- /app -->

<script src="js/script.js"></script>
<script>
  document.getElementById('pTitle').textContent = birthdayGirl.song.title;
  document.getElementById('pArtist').textContent = birthdayGirl.song.artist;
  // audio-nya global & persist lintas halaman, lihat initGlobalPlayer() di js/script.js
  if (typeof bindMusicPageUI === 'function') bindMusicPageUI();
</script>
</body>
</html>
