<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>a little secret ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grain"></div>
<div id="app">

<div class="page" id="pageRoot">
  <svg class="deco floaty" style="--r:-6deg; top:8%; left:7%; width:30px;" viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.8 2.5 5 6.2 5c2 0 3.4 1.1 4.1 2.4C11 6.1 12.4 5 14.4 5 18.1 5 19.9 8.8 18 12.5 16 16.65 12 21 12 21Z" fill="#712D38"/></svg>
  <svg class="deco" style="top:16%; right:9%; width:13px; animation:twinkle 2.3s ease-in-out infinite;" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#C9A05A"/></svg>
  <svg class="deco floaty" style="--r:9deg; bottom:10%; left:10%; width:24px; animation-delay:.7s;" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#EDDEBA"/></svg>
  <svg class="deco floaty" style="--r:-8deg; bottom:14%; right:8%; width:20px; animation-delay:1.3s;" viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.8 2.5 5 6.2 5c2 0 3.4 1.1 4.1 2.4C11 6.1 12.4 5 14.4 5 18.1 5 19.9 8.8 18 12.5 16 16.65 12 21 12 21Z" fill="#C9A05A"/></svg>

  <div class="section" style="text-align:center; margin-top:24px;">
    <span class="eyebrow-tag reveal"><span class="dot"></span>hmmm.. pin nya apa nyakk</span>
    <h1 class="title-serif reveal" style="font-size:clamp(1.5rem,5.5vw,2rem);">clue nya :<br>adek ketik setiap hari</h1>

    <div class="pin-wrap reveal">
      <!-- pita/ribbon banner di atas kartu -->
      <div class="pin-ribbon">
        <svg viewBox="0 0 150 60" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 8 L40 26 L10 44 L18 26 Z" fill="#712D38"/>
          <path d="M140 8 L110 26 L140 44 L132 26 Z" fill="#712D38"/>
          <rect x="34" y="4" width="82" height="34" rx="6" fill="#C9A05A"/>
          <rect x="34" y="4" width="82" height="34" rx="6" fill="none" stroke="#FFF9F0" stroke-width="1.4" stroke-dasharray="3 4"/>
          <text x="75" y="26" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="18" fill="#FFF9F0">surprise!</text>
        </svg>
      </div>

      <div class="pin-card" id="pinCard">
        <!-- pita kecil / bow di kedua sudut atas kartu -->
        <svg class="pin-bow left" viewBox="0 0 40 40"><path d="M20 20 C10 8 2 12 4 20 C2 28 10 32 20 20Z" fill="#712D38"/><path d="M20 20 C30 8 38 12 36 20 C38 28 30 32 20 20Z" fill="#712D38"/><circle cx="20" cy="20" r="4.5" fill="#C9A05A"/></svg>
        <svg class="pin-bow right" viewBox="0 0 40 40"><path d="M20 20 C10 8 2 12 4 20 C2 28 10 32 20 20Z" fill="#C9A05A"/><path d="M20 20 C30 8 38 12 36 20 C38 28 30 32 20 20Z" fill="#C9A05A"/><circle cx="20" cy="20" r="4.5" fill="#712D38"/></svg>

        <div class="pin-lock" id="pinLock">
          <svg viewBox="0 0 48 48" fill="none">
            <path class="shackle" d="M15 20V14a9 9 0 0118 0v6" stroke="#712D38" stroke-width="3.2" stroke-linecap="round"/>
            <rect x="10" y="20" width="28" height="20" rx="5" fill="#712D38"/>
            <circle cx="24" cy="28" r="3.2" fill="#F3E6C4"/>
            <rect x="22.7" y="29.5" width="2.6" height="6" rx="1.2" fill="#F3E6C4"/>
          </svg>
          <!-- sparkle bursts, muncul saat kode benar -->
          <svg class="pin-sparkle" style="top:-6px; left:-10px; width:16px; animation-delay:.05s;" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#C9A05A"/></svg>
          <svg class="pin-sparkle" style="top:2px; right:-14px; width:12px; animation-delay:.15s;" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#712D38"/></svg>
          <svg class="pin-sparkle" style="bottom:-8px; left:4px; width:10px; animation-delay:.25s;" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#EDDEBA"/></svg>
        </div>

        <p class="pin-title">Masukin angka kita yaa bb</p>
        <p class="pin-sub">leadis first kannn...♡</p>

        <div class="pin-inputs" id="pinInputs">
          <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" autocomplete="off">
          <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" autocomplete="off">
          <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" autocomplete="off">
          <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" autocomplete="off">
        </div>

        <p class="pin-hint" id="pinHint">hmm kayaknya bukan yang itu deh, coba yang lain bb ♡</p>

        <button class="btn" id="pinBtn" style="margin-top:10px;">ARE UU READYY??</button>
        <p class="pin-status" id="pinStatus"></p>
      </div>
    </div>
  </div>
</div>

</div><!-- /app -->

<script src="js/script.js"></script>
<script>
  (function(){
    const CORRECT = "2521";
    const inputs = Array.from(document.querySelectorAll('.pin-digit'));
    const inputsWrap = document.getElementById('pinInputs');
    const hint = document.getElementById('pinHint');
    const btn = document.getElementById('pinBtn');
    const card = document.getElementById('pinCard');
    const lock = document.getElementById('pinLock');
    const status = document.getElementById('pinStatus');

    // kalau udah pernah benar sebelumnya di sesi ini, langsung lanjut
    if (sessionStorage.getItem('pinOK') === '1') {
      if (typeof navigateTo === 'function') navigateTo('wish.html'); else window.location.href = 'wish.html';
      return;
    }

    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/[^0-9]/g, '').slice(0,1);
        if (inp.value && i < inputs.length - 1) inputs[i+1].focus();
        if (inputs.every(x => x.value)) checkPin();
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus();
        if (e.key === 'Enter') checkPin();
      });
    });

    btn.addEventListener('click', checkPin);

    function checkPin(){
      const code = inputs.map(i => i.value).join('');
      if (code.length < 4) {
        wrongShake();
        return;
      }
      if (code === CORRECT) {
        correct();
      } else {
        wrongShake();
      }
    }

    function wrongShake(){
      inputsWrap.classList.remove('shake');
      void inputsWrap.offsetWidth; // restart animation
      inputsWrap.classList.add('shake');
      hint.classList.add('show');
      setTimeout(() => {
        inputs.forEach(i => i.value = '');
        inputs[0].focus();
      }, 260);
    }

    function correct(){
      inputs.forEach(i => i.disabled = true);
      btn.disabled = true;
      btn.style.opacity = .5;
      btn.style.pointerEvents = 'none';
      hint.classList.remove('show');
      card.classList.add('success');
      lock.classList.add('unlocked');
      status.textContent = "Yeayy, kebuka! liat kejutannya yuk.. ✨";
      if (typeof launchConfetti === 'function') launchConfetti(30);
      sessionStorage.setItem('pinOK', '1');
      setTimeout(() => { if (typeof navigateTo === 'function') navigateTo('wish.html'); else window.location.href = 'wish.html'; }, 1500);
    }
  })();
</script>
</body>
</html>
